# This project was built and verified on a 3 GB container, so the JVM stays
# well below the point where the kernel OOM-killer steps in. The Kotlin
# compiler runs inside the Gradle daemon instead of forking a second JVM.
org.gradle.jvmargs=-Xmx2100m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
